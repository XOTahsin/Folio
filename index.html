<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folio — Premium Notes</title>
<meta name="description" content="A fast, private, offline notepad with folders, pinned notes, reminders and rich text.">
<meta name="theme-color" content="#0a0f18">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
/* Apply theme before first paint (no flash) */
(function(){try{
  var s=JSON.parse(localStorage.getItem('folio_settings')||'{}'),t=s.theme||'dark';
  if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
}catch(e){}})();
</script>
<style>
:root{
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:Georgia,"Times New Roman",serif;
  --r:18px; --r-sm:12px;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --accent:#f5b73b; --accent-ink:#2a1c00; --accent-soft:rgba(245,183,59,.16);
  --danger:#ff6b6b;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0a0f18; --shell:rgba(14,20,32,.62); --side:rgba(255,255,255,.035);
  --surface:#111826; --surface2:rgba(255,255,255,.07); --glass:rgba(255,255,255,.055);
  --glass-hi:rgba(255,255,255,.1); --border:rgba(255,255,255,.1); --border2:rgba(255,255,255,.2);
  --text:#eef2f8; --muted:#9aa6b8; --faint:#667286; --text-faint:#667286;
  --orb1:rgba(245,150,40,.30); --orb2:rgba(60,130,255,.28); --orb3:rgba(245,200,60,.22);
  --shadow:0 24px 80px rgba(0,0,0,.55); --scrim:rgba(4,8,14,.66);
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#e8edf6; --shell:rgba(255,255,255,.6); --side:rgba(255,255,255,.5);
  --surface:#ffffff; --surface2:rgba(15,23,42,.06); --glass:rgba(255,255,255,.72);
  --glass-hi:rgba(255,255,255,.95); --border:rgba(15,23,42,.1); --border2:rgba(15,23,42,.22);
  --text:#101828; --muted:#566177; --faint:#98a2b3; --text-faint:#98a2b3;
  --accent:#d98a00; --accent-ink:#fff; --accent-soft:rgba(217,138,0,.14);
  --orb1:rgba(255,160,60,.35); --orb2:rgba(90,150,255,.32); --orb3:rgba(255,210,80,.35);
  --shadow:0 24px 70px rgba(30,45,80,.2); --scrim:rgba(20,30,50,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font:400 14px/1.45 var(--font);background:var(--bg);color:var(--text);
  overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
  touch-action:manipulation;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Static ambient background — no animation, no blur filter: zero battery cost */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(520px 380px at 10% 78%,var(--orb1),transparent 70%),
    radial-gradient(560px 420px at 48% 38%,var(--orb2),transparent 70%),
    radial-gradient(480px 380px at 94% 58%,var(--orb3),transparent 70%),
    var(--bg)}

.shell{position:relative;z-index:1;display:flex;height:100dvh;
  padding:var(--sat) var(--sar) var(--sab) var(--sal)}
@media(min-width:900px){
  .shell{margin:18px;height:calc(100dvh - 36px);padding:0;border-radius:28px;overflow:hidden;
    background:var(--shell);border:1px solid var(--border);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%)}
}

/* SIDEBAR */
.sidebar{width:268px;flex:none;display:flex;flex-direction:column;gap:4px;padding:20px 14px 14px;
  background:var(--side);border-right:1px solid var(--border);overflow-y:auto;scrollbar-width:none}
.sidebar::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand svg{width:34px;height:34px;flex:none;border-radius:10px}
.brand b{display:block;font-size:16px;font-weight:650;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.lbl{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px;color:var(--muted);font-size:12.5px;font-weight:500}
.lbl button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.lbl button:hover{background:var(--surface2);color:var(--text)}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:12px;color:var(--muted);text-align:left;position:relative;transition:background .15s,color .15s}
.nav:hover{background:var(--surface2);color:var(--text)}
.nav.on{background:var(--glass-hi);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.nav.on::before{content:"";position:absolute;left:-14px;top:11px;bottom:11px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav .n{margin-left:auto;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.fpill{display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;margin-bottom:7px;border-radius:12px;
  background:var(--glass);border:1px solid var(--border);text-align:left;transition:border-color .15s,background .15s}
.fpill:hover{border-color:var(--border2)}
.fpill.on{background:var(--glass-hi);border-color:var(--border2)}
.fpill svg{color:var(--fc,var(--accent));fill:color-mix(in srgb,var(--fc,var(--accent)) 35%,transparent)}
.fpill span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpill em{font-style:normal;color:var(--faint);font-size:12px}
.side-foot{margin-top:auto;padding:12px 6px 2px;font-size:11.5px;color:var(--faint)}
.btn-install-side{display:none;width:100%;margin-top:10px;height:40px;border-radius:12px;align-items:center;justify-content:center;gap:8px;
  background:var(--accent-soft);color:var(--accent);font-weight:600;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.btn-install-side.show{display:flex}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:22px 28px 0}
.top h1{font-size:26px;font-weight:650;letter-spacing:-.025em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.ib:hover{background:var(--surface2);color:var(--text)}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.menu-btn{display:none}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:99px}
.me:hover{background:var(--surface2)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#1b1200;
  background:linear-gradient(135deg,#ffd166,#ff8a3d);box-shadow:0 0 0 2px var(--border2)}
.me div{line-height:1.2;text-align:left}
.me b{display:block;font-size:13.5px;font-weight:600}
.me small{font-size:11px;color:var(--muted)}
.bar{display:flex;gap:12px;padding:16px 28px 4px}
.search{flex:1;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--glass);border:1px solid var(--border);color:var(--muted);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text)}
.search input::placeholder{color:var(--faint)}
.search .clr{display:none;width:24px;height:24px;border-radius:50%;place-items:center}
.search.has .clr{display:grid}
.btn-new{display:flex;align-items:center;gap:9px;height:46px;padding:0 20px;border-radius:14px;font-weight:600;
  background:linear-gradient(180deg,var(--glass-hi),var(--glass));border:1px solid var(--border2);transition:transform .12s,border-color .15s}
.btn-new svg{color:var(--accent);stroke-width:2.4}
.btn-new:hover{border-color:var(--accent)}
.btn-new:active{transform:scale(.97)}

.content{flex:1;overflow-y:auto;padding:18px 28px 32px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;-webkit-overflow-scrolling:touch}
.sec{margin-bottom:26px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:30px}
.sec-h h2{font-size:14px;font-weight:600;color:var(--text)}
.sec-h small{color:var(--faint);font-size:12px}
.sec-h .sp{flex:1}
.chip-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:10px;font-size:12.5px;color:var(--muted);background:var(--glass);border:1px solid var(--border)}
.chip-btn:hover{color:var(--text);border-color:var(--border2)}
.chip-btn.danger{color:var(--danger)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}

/* NOTE CARDS */
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-height:128px;padding:14px 16px 12px;border-radius:var(--r);text-align:left;cursor:pointer;
  content-visibility:auto;contain-intrinsic-size:auto 140px;transition:transform .18s,box-shadow .18s;overflow:hidden;
  --c1:#8a96aa;--c2:#5d6b82;--ink:#fff;--glow:rgba(120,140,170,.4)}
.card h3{padding-right:24px;font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card p{font-size:12.5px;line-height:1.45;opacity:.82;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;flex-wrap:wrap;gap:5px}
.card .tg{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.card .meta{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:11px;opacity:.8;padding-top:4px}
.card .meta .due{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.card .meta .due svg{width:12px;height:12px}
.card .qa{position:absolute;top:8px;right:8px;display:flex;gap:2px}
.card .qa button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;opacity:0;transition:opacity .15s,background .15s}
.card .qa button svg{width:15px;height:15px}
.card.pinned .qa button.pinb{opacity:.75}
@media(hover:none){.card .qa button{opacity:.6}}
.card:hover .qa button{opacity:.85}
.card .qa button:hover{opacity:1;background:rgba(127,127,127,.22)}
.card:active{transform:scale(.985)}
@media(hover:hover){.card:hover{transform:translateY(-2px)}}

.card.sticky{background:linear-gradient(150deg,var(--c1),var(--c2));color:var(--ink);box-shadow:0 14px 30px -14px var(--glow),inset 0 1px 0 rgba(255,255,255,.38)}
.card.sticky .tg{background:rgba(0,0,0,.14)}
.card.sticky::after{content:"";position:absolute;right:0;bottom:0;width:28px;height:28px;border-bottom-right-radius:var(--r);
  background:linear-gradient(135deg,transparent 50%,rgba(255,255,255,.42) 50%);box-shadow:-4px -4px 10px rgba(0,0,0,.16)}
.card.glass{background:linear-gradient(160deg,var(--glass-hi),var(--glass));border:1px solid var(--border);color:var(--text)}
.card.glass::before{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--c2) 28%,transparent),transparent 70%);pointer-events:none}
.card.glass.tint{border-color:color-mix(in srgb,var(--c2) 55%,transparent)}
.card.glass .tg{background:var(--surface2);color:var(--muted)}
.card.glass .meta{color:var(--muted)}
.card.glass .due{color:var(--accent)}
.card.glass .due.over{color:var(--danger)}
.card.trashed{opacity:.9}
.card.trashed .qa button{opacity:.85}

.c-orange{--c1:#ffae3a;--c2:#f57c00;--ink:#2d1700;--glow:rgba(245,124,0,.7)}
.c-blue{--c1:#63a8ff;--c2:#2f6fe0;--ink:#061a3d;--glow:rgba(47,111,224,.7)}
.c-yellow{--c1:#ffe770;--c2:#f6c32c;--ink:#3a2c00;--glow:rgba(246,195,44,.65)}
.c-green{--c1:#67dc92;--c2:#25a35a;--ink:#032a18;--glow:rgba(37,163,90,.65)}
.c-pink{--c1:#ff93b8;--c2:#e8548a;--ink:#3b0821;--glow:rgba(232,84,138,.65)}
.c-purple{--c1:#bb92ff;--c2:#7c4de0;--ink:#1c0846;--glow:rgba(124,77,224,.65)}

/* FOLDER TILES */
.ftile{position:relative;margin-top:10px;height:104px;border-radius:16px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;
  background:linear-gradient(165deg,color-mix(in srgb,var(--fc) 22%,var(--glass-hi)),var(--glass));border:1px solid var(--border);transition:transform .18s,border-color .15s}
.ftile::before{content:"";position:absolute;left:-1px;top:-10px;width:46%;height:14px;border-radius:10px 10px 0 0;
  background:color-mix(in srgb,var(--fc) 22%,var(--glass-hi));border:1px solid var(--border);border-bottom:0}
.ftile b{font-size:14px;font-weight:600}
.ftile small{color:var(--muted);font-size:12px}
.ftile:active{transform:scale(.985)}
@media(hover:hover){.ftile:hover{transform:translateY(-2px);border-color:var(--border2)}}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:56px 20px;color:var(--muted)}
.empty svg.i{width:54px;height:54px;stroke-width:1.2;opacity:.5}
.empty h3{color:var(--text);font-size:17px;font-weight:600}
.empty .btn-new{margin-top:8px;color:var(--text)}

/* SETTINGS */
.set{display:grid;gap:14px;max-width:720px}
.pnl{padding:18px;border-radius:var(--r);background:var(--glass);border:1px solid var(--border)}
.pnl h3{font-size:14px;font-weight:600;margin-bottom:4px}
.pnl p{color:var(--muted);font-size:12.5px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{width:100%;height:42px;padding:0 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);outline:0}
.field:focus{border-color:var(--accent)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}
.seg button{padding:7px 16px;border-radius:9px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--glass-hi);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.sw{position:relative;width:46px;height:28px;border-radius:99px;background:var(--surface2);border:1px solid var(--border2);flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on::after{transform:translateX(18px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--glass-hi);border:1px solid var(--border2)}
.btn:hover{border-color:var(--text-faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.primary.danger{background:var(--danger);color:#fff}

/* FAB (mobile) */
.fab{display:none;position:fixed;right:calc(18px + var(--sar));bottom:calc(20px + var(--sab));z-index:30;width:58px;height:58px;border-radius:20px;place-items:center;
  background:linear-gradient(145deg,#ffd166,#f5a623);color:#2a1c00;box-shadow:0 12px 28px -8px rgba(245,166,35,.7),inset 0 1px 0 rgba(255,255,255,.5);transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px;stroke-width:2.6}

/* EDITOR SHEET */
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center}
.sheet.open{display:flex}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s both}
.panel{position:relative;width:min(1000px,94vw);height:min(92dvh,920px);display:flex;flex-direction:column;border-radius:26px;overflow:hidden;
  background:var(--surface);border:1px solid var(--border2);box-shadow:var(--shadow);animation:rise .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
.eh{display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--border)}
.eh .sp{flex:1}
.fsel{height:36px;max-width:150px;padding:0 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);outline:0;color:var(--text);font-size:13px;cursor:pointer}
.fsel option{background:var(--surface);color:var(--text)}
.etitle{padding:16px 28px 4px}
#note-title{width:100%;background:none;border:0;outline:0;font-size:28px;font-weight:700;letter-spacing:-.025em;color:var(--text)}
#note-title::placeholder{color:var(--faint)}
.emeta{font-size:12px;color:var(--faint);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.emeta .due{color:var(--accent);display:inline-flex;gap:4px;align-items:center}
.emeta .due svg{width:13px;height:13px}
.tagsbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 28px 10px}
.tchip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.tchip button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;opacity:.7}
.tchip button svg{width:11px;height:11px;stroke-width:2.6}
.tadd{height:26px;padding:0 10px;border-radius:99px;border:1px dashed var(--border2);color:var(--muted);font-size:12px}
.tadd:hover{color:var(--accent);border-color:var(--accent)}
.tbar{display:flex;align-items:center;gap:2px;padding:6px 14px;border-block:1px solid var(--border);overflow-x:auto;scrollbar-width:none;background:var(--surface)}
.tbar::-webkit-scrollbar{display:none}
.tb{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .12s,color .12s}
.tb svg.i{width:16px;height:16px}
.tb:hover{background:var(--surface2);color:var(--text)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb.t{font-weight:700;font-size:15px}
.tb.it{font-style:italic;font-family:var(--serif);font-size:16px}
.tb.un{text-decoration:underline}.tb.st{text-decoration:line-through}
.tsep{flex:none;width:1px;height:20px;background:var(--border2);margin:0 5px}
.tsel{flex:none;height:32px;padding:0 6px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12.5px;outline:0;cursor:pointer;max-width:116px}
.tsel option{background:var(--surface)}
.pop .lst{display:flex;flex-wrap:wrap;gap:8px;padding:4px}
.pop .lst button{min-width:44px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--border2);font-weight:700;font-size:15px}
.pop .lst button:hover{background:var(--surface2);border-color:var(--accent)}
.pop .ph{padding:6px 6px 2px;font-size:12px;color:var(--muted)}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);display:block}
.escroll{flex:1;overflow-y:auto;padding:20px 28px 40px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
#editor{max-width:760px;margin:0 auto;min-height:55%;outline:0;font-size:16px;line-height:1.75;overflow-wrap:anywhere;caret-color:var(--accent);-webkit-user-select:text;user-select:text}
#editor:empty::before{content:attr(data-placeholder);color:var(--faint);pointer-events:none}
#editor h1{font-size:28px;line-height:1.25;margin:.7em 0 .3em;letter-spacing:-.02em}
#editor h2{font-size:22px;line-height:1.3;margin:.7em 0 .3em;letter-spacing:-.015em}
#editor h3{font-size:18px;margin:.7em 0 .3em}
#editor blockquote{border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:.6em 0;color:var(--muted)}
#editor pre{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;margin:.6em 0}
#editor a{color:var(--accent);text-decoration:underline}
#editor img{max-width:100%;height:auto;border-radius:14px;margin:8px 0;display:block}
#editor ul,#editor ol{padding-left:26px;margin:.3em 0}
#editor ul.checklist{list-style:none;padding-left:2px}
#editor ul.checklist li{display:flex;gap:10px;align-items:baseline}
#editor ul.checklist input{accent-color:var(--accent);width:18px;height:18px;flex:none;transform:translateY(3px)}
#editor ul.checklist li:has(>input:checked){opacity:.5;text-decoration:line-through}
/* "default text colour" sentinel: follows the theme in light & dark */
#editor [style*="rgb(1, 1, 1)"],#editor font[color="#010101"]{color:var(--text)!important}
.estat{display:flex;gap:16px;align-items:center;padding:8px 28px calc(8px + var(--sab));border-top:1px solid var(--border);font-size:12px;color:var(--faint)}
.estat .sv{margin-left:auto;display:flex;align-items:center;gap:6px}
.sdot{width:7px;height:7px;border-radius:50%;background:#3ecf8e;transition:background .2s}
.sdot.un{background:var(--accent)}

/* POPOVER / DIALOG / TOAST / INSTALL */
.pop{position:fixed;z-index:95;min-width:170px;padding:8px;border-radius:16px;background:var(--surface);border:1px solid var(--border2);box-shadow:var(--shadow);animation:fade .12s both}
.pop .pg{display:grid;grid-template-columns:repeat(4,38px);gap:8px;padding:4px}
.pop .pg button,.pop .pg label{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--border2);cursor:pointer;position:relative}
.pop .pg input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pop .mi{display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 12px;border-radius:10px;text-align:left;color:var(--text)}
.pop .mi:hover{background:var(--surface2)}
.pop .mi.danger{color:var(--danger)}
.dlg{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--scrim);opacity:0;transition:opacity .18s}
.dlg.show{opacity:1}
.dlg-box{width:min(420px,100%);padding:22px;border-radius:22px;background:var(--surface);border:1px solid var(--border2);box-shadow:var(--shadow);transform:translateY(10px);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.dlg.show .dlg-box{transform:none}
.dlg-box h3{font-size:18px;font-weight:650;margin-bottom:12px}
.dlg-body{color:var(--muted);font-size:13.5px;line-height:1.55}
.dlg-body .field{margin-top:6px;color:var(--text)}
.dlg-body label{display:block;margin-top:10px;font-size:12px}
.dlg-body ol{padding-left:20px;display:grid;gap:8px;color:var(--text)}
.dlg-act{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(26px + var(--sab));z-index:120;transform:translate(-50%,24px);opacity:0;pointer-events:none;
  padding:11px 20px;border-radius:99px;background:var(--text);color:var(--bg);font-weight:500;font-size:13.5px;max-width:90vw;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s}
.toast.show{transform:translate(-50%,0);opacity:1}
.install{position:fixed;left:50%;bottom:calc(22px + var(--sab));z-index:55;width:min(440px,calc(100vw - 24px));transform:translate(-50%,30px);opacity:0;visibility:hidden;pointer-events:none;
  display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:22px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--border2);box-shadow:var(--shadow);
  transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s,visibility 0s linear .4s;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.install.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.install img{width:44px;height:44px;border-radius:12px;flex:none}
.install div{flex:1;min-width:0;line-height:1.25}
.install b{display:block;font-size:14.5px}
.install small{color:var(--muted);font-size:12px}
.install .go{height:38px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.install .x{width:42px;height:42px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.scrim-d{display:none}

@media(max-width:899px){
  .shell{display:block}
  .sidebar{position:fixed;z-index:50;left:0;top:0;bottom:0;width:min(84vw,310px);padding-top:calc(20px + var(--sat));padding-bottom:calc(14px + var(--sab));
    background:var(--surface);transform:translateX(-104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .scrim-d{display:block;position:fixed;inset:0;z-index:45;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim-d.open{opacity:1;pointer-events:auto}
  .main{height:100%}
  .menu-btn{display:grid}
  .top{padding:14px 16px 0;gap:8px}
  .top h1{font-size:21px}
  .me div{display:none}
  .me{padding:2px}
  .bar{padding:12px 16px 2px}
  .bar .btn-new{display:none}
  .fab.show{display:grid}
  .content{padding:14px 16px calc(96px + var(--sab))}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{min-height:118px;padding:12px 13px 10px}
  .card .qa button{opacity:.55}
  input,select,.field,#note-title{font-size:16px}
  .sheet{align-items:stretch}
  .panel{width:100%;height:100dvh;border-radius:0;border:0;padding-top:var(--sat)}
  .etitle,.tagsbar{padding-left:18px;padding-right:18px}
  #note-title{font-size:24px}
  .escroll{padding:14px 18px 48px}
  .estat{padding-left:18px;padding-right:18px}
  .install{bottom:calc(92px + var(--sab))}
}
@media(max-width:520px){.mo{display:none}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.bg,.shell,.fab,.install{display:none!important}}

<div class="bg"></div>

  </aside>
  <div class="scrim-d" id="scrim-d"></div>

  <main class="main">
    <header class="top">
      <button class="ib menu-btn" id="menu-btn" aria-label="Menu"></button>

      <span class="sp"></span>
      <button class="ib" id="theme-btn" aria-label="Toggle theme"></button>

    <div class="bar">

        <button type="button" class="clr ib" id="search-clr" aria-label="Clear search" style="width:24px;height:24px"></button>
      </label>
      <button class="btn-new" data-act="new-note" id="btn-new"></button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<button class="fab" id="fab" data-act="new-note" aria-label="New note"></button>

<!-- EDITOR -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="scrim" id="sheet-scrim"></div>
  <section class="panel" role="dialog" aria-modal="true" aria-label="Note editor">
    <div class="eh">
      <button class="ib" id="ed-back" aria-label="Close note"></button>
      <span class="sp"></span>
      <select class="fsel" id="ed-folder" aria-label="Folder"></select>
      <button class="ib" id="ed-color" aria-label="Note colour" title="Note colour"></button>
      <button class="ib" id="ed-remind" aria-label="Reminder" title="Reminder"></button>
      <button class="ib" id="ed-pin" aria-label="Pin note" title="Pin"></button>
      <button class="ib" id="ed-more" aria-label="More" title="More"></button>
    </div>
    <div class="etitle">
      <input id="note-title" type="text" placeholder="Title" autocomplete="off" aria-label="Note title" enterkeyhint="next">
      <div class="emeta" id="ed-meta"></div>
    </div>
    <div class="tagsbar" id="tagsbar"></div>
    <div class="tbar" id="tbar" role="toolbar" aria-label="Formatting"></div>
    <div class="escroll" id="escroll">
      <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start writing…" role="textbox" aria-multiline="true" aria-label="Note body"></div>
    </div>
    <div class="estat">
      <span id="wc">0 words</span><span id="cc">0 chars</span><span id="rt">~1 min</span>
      <span class="sv"><i class="sdot" id="sdot"></i><span id="sst">Saved</span></span>
    </div>
  </section>
</div>

<aside class="install" id="install" role="dialog" aria-label="Install Folio">
  <img src="icons/icon-192.png" alt="" width="44" height="44">
  <div><b>Install Folio</b><small>Full-screen app · works offline</small></div>
  <button class="go" id="install-go">Install</button>
  <button class="x" id="install-x" aria-label="Dismiss"></button>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const COLOR_HEX={orange:'#f57c00',blue:'#2f6fe0',yellow:'#f6c32c',green:'#25a35a',pink:'#e8548a',purple:'#7c4de0'};
const FOLDER_COLORS=['#f5b73b','#5aa2ff','#5fd48a','#ff8fb5','#b58cff','#ff8a4c'];

let view='all', query='', cur=null, dirty=false, sheetOpen=false;
const DAY=864e5;

function sanitize(html){
  const doc=new DOMParser().parseFromString('<body>'+(html||'')+'</body>','text/html');
  doc.querySelectorAll('script,style,iframe,object,embed,link,meta,base,form').forEach(n=>n.remove());
  doc.body.querySelectorAll('*').forEach(el=>{
    [...el.attributes].forEach(a=>{
      const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();
      if(n.startsWith('on')||((n==='href'||n==='src'||n==='xlink:href')&&/^(javascript|vbscript):/.test(v))||(n==='src'&&/^data:(?!image\/)/.test(v))) el.removeAttribute(a.name);
    });
  });
  return doc.body.innerHTML;
}
const toText=html=>(new DOMParser().parseFromString(String(html||'').replace(/<\/(p|div|li|h[1-6]|blockquote|pre)>|<br\s*\/?>/gi,' '),'text/html').body.textContent||'').replace(/\s+/g,' ').trim();
function normalize(n){
  return {id:n.id||uid(),title:String(n.title||''),content:sanitize(String(n.content||'')
      .replace(/#1a1510/gi,'#010101').replace(/rgb\(26,\s*21,\s*16\)/gi,'rgb(1, 1, 1)')),
    text:n.text!=null?String(n.text):toText(n.content),tags:Array.isArray(n.tags)?n.tags.map(String):[],
    created:+n.created||Date.now(),updated:+n.updated||Date.now(),pinned:!!n.pinned,
    color:COLORS.includes(n.color)?n.color:'',folder:n.folder||'',reminder:+n.reminder||0,trashed:+n.trashed||0};
}
/* one-time migration from the old Folio format */
if(!settings.migrated){
  notes=notes.map(normalize); settings.migrated=true;
  if(localStorage.getItem('folio_notes')) LS.set('folio_notes',notes);
  LS.set('folio_settings',settings);
}
notes=notes.filter(n=>!(n.trashed&&Date.now()-n.trashed>30*DAY)); // auto-empty trash after 30 days

const persistNotes=()=>{ if(!LS.set('folio_notes',notes)) toast('Storage is full — export a backup & remove big images',4000); };
const persistFolders=()=>LS.set('folio_folders',folders);
const persistSettings=()=>LS.set('folio_settings',settings);
const live=()=>notes.filter(n=>!n.trashed);
const byId=id=>notes.find(n=>n.id===id);
const hashId=id=>[...id].reduce((a,c)=>a+c.charCodeAt(0),0);

/* ================= formatting helpers ================= */
function fmtDate(ts){
  const d=new Date(ts),now=new Date(),diff=now-d;
  if(diff<6e4) return 'Just now';
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  const o={day:'numeric',month:'short'}; if(d.getFullYear()!==now.getFullYear()) o.year='numeric';
  return d.toLocaleDateString(undefined,o);
}
const fmtRem=ts=>new Date(ts).toLocaleString(undefined,{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const toLocalInput=ts=>{const d=new Date(ts-new Date(ts).getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};

const byUpdated=(a,b)=>b.updated-a.updated;

function renderContent(){
  const el=$('#content'), L=live(); let h='';

    const q=query.toLowerCase();

    h=r.length?sec(`Results <small>${r.length}</small>`,grid(r)):emptyHTML('search','Nothing found',`No notes match “${esc(query)}”.`);
  }else if(view==='all'){

    if(!L.length){h=emptyHTML('note','Your notebook is empty','Capture your first idea — it takes a second.',true);}

      if(folders.length) h+=sec('Folders',`<div class="grid">${folders.map(f=>`<button class="ftile" data-view="folder:${f.id}" style="--fc:${f.color}"><b>${esc(f.name)}</b><small>${L.filter(n=>n.folder===f.id).length} notes</small></button>`).join('')}</div>`);
      if(rest.length) h+=sec('Notes',grid(rest));

    const r=L.filter(n=>n.pinned).sort(byUpdated);

function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms)}
let dlgEl=null;
function closeDialog(){if(!dlgEl)return;const d=dlgEl;dlgEl=null;d.classList.remove('show');setTimeout(()=>d.remove(),180)}
function dialog({title,body='',actions=[],onOpen}){
  closeDialog();
  const o=document.createElement('div');o.className='dlg';
  o.innerHTML=`<div class="dlg-box" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="dlg-body">${body}</div><div class="dlg-act"></div></div>`;
  actions.forEach(a=>{const b=document.createElement('button');b.className='btn '+(a.cls||'');b.textContent=a.label;
    b.onclick=()=>{ if(!a.fn||a.fn(o)!==false) closeDialog(); }; $('.dlg-act',o).appendChild(b);});
  o.addEventListener('pointerdown',e=>{if(e.target===o)closeDialog()});
  o.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();$('.btn.primary',o)?.click()}});
  document.body.appendChild(o);dlgEl=o;requestAnimationFrame(()=>o.classList.add('show'));onOpen&&onOpen(o);return o;
}
const confirmBox=(title,msg,ok,fn)=>dialog({title,body:msg,actions:[{label:'Cancel'},{label:ok,cls:'primary danger',fn}]});
let pop=null,popAnchor=null;
function closePop(){if(pop){pop.remove();pop=null;popAnchor=null;document.removeEventListener('pointerdown',popOutside,true)}}
function popOutside(e){if(pop&&!pop.contains(e.target)&&!(popAnchor&&popAnchor.contains(e.target)))closePop()}
function showPop(anchor,html,handler){
  if(pop&&popAnchor===anchor){closePop();return}
  closePop();
  const p=document.createElement('div');p.className='pop';p.innerHTML=html;document.body.appendChild(p);
  const r=anchor.getBoundingClientRect(),w=p.offsetWidth,h=p.offsetHeight;
  p.style.left=Math.min(Math.max(8,r.left),innerWidth-w-8)+'px';
  let y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);p.style.top=y+'px';
  p.addEventListener('pointerdown',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
  p.addEventListener('click',e=>{const t=e.target.closest('[data-v]');if(t){closePop();handler(t.dataset.v)}});
  p.addEventListener('change',e=>{if(e.target.type==='color'){closePop();handler(e.target.value)}});
  pop=p;popAnchor=anchor;document.addEventListener('pointerdown',popOutside,true);
}

function setListStyle(t){

function flush(){
  if(!cur)return; const n=byId(cur); if(!n)return;
  if(dirty){ n.title=$('#note-title').value.trim(); n.content=ed.innerHTML; n.text=(ed.innerText||'').replace(/\s+/g,' ').trim().slice(0,4000); n.updated=Date.now(); persistNotes(); dirty=false; setSaved(true); metaLine(n); }
}
function closeEditor(fromPop){
  if(!sheetOpen)return; clearTimeout(saveT); closePop(); flush();
  const n=byId(cur);
  if(n&&!n.title&&!n.text&&!n.reminder&&!/<img/i.test(n.content)){ notes=notes.filter(x=>x.id!==cur); persistNotes(); }
  cur=null; sheetOpen=false; $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden','true');
  renderAll(); scheduleReminder();
  if(!fromPop&&history.state&&history.state.ed) history.back();
}
window.addEventListener('popstate',()=>{ if(sheetOpen) closeEditor(true); });
let saveT=null;
function markDirty(){dirty=true;setSaved(false);clearTimeout(saveT);saveT=setTimeout(flush,600)}
function setSaved(ok){$('#sdot').classList.toggle('un',!ok);$('#sst').textContent=ok?'Saved':'Saving…'}
const updateCounts=debounce(()=>{

  $('#wc').textContent=w+' word'+(w!==1?'s':''); $('#cc').textContent=t.length+' chars'; $('#rt').textContent='~'+Math.max(1,Math.ceil(w/200))+' min';
},200);

ed.addEventListener('change',e=>{if(e.target.type==='checkbox'){e.target.toggleAttribute('checked',e.target.checked);markDirty()}});
ed.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey){
    const k=e.key.toLowerCase();
    if(k==='b'){e.preventDefault();exec('bold')} else if(k==='i'){e.preventDefault();exec('italic')}
    else if(k==='u'){e.preventDefault();exec('underline')} else if(k==='k'){e.preventDefault();linkDialog()}
    else if(k==='s'){e.preventDefault();flush();toast('Saved ✓',1000)}
  }
  if(e.key==='Enter'&&!e.shiftKey){
    const s=getSelection(); if(!s.rangeCount)return;
    let node=s.anchorNode; const li=(node.nodeType===1?node:node.parentElement).closest('ul.checklist li'); if(!li)return;
    e.preventDefault(); const list=li.parentElement;
    if(!li.textContent.replace(/\u00a0/g,'').trim()){ // empty item → leave list
      const p=document.createElement('p');p.innerHTML='<br>';list.after(p);li.remove();if(!list.children.length)list.remove();
      const r=document.createRange();r.setStart(p,0);r.collapse(true);s.removeAllRanges();s.addRange(r);
    }else{
      const nl=document.createElement('li');nl.innerHTML='<input type="checkbox">&nbsp;';li.after(nl);
      const r=document.createRange();r.setStart(nl,nl.childNodes.length);r.collapse(true);s.removeAllRanges();s.addRange(r);
    }
    markDirty();
  }
});
ed.addEventListener('paste',e=>{
  const cd=e.clipboardData; if(!cd)return;
  const img=[...cd.files||[]].find(f=>f.type.startsWith('image/'));
  e.preventDefault();
  if(img){compressImage(img).then(src=>{document.execCommand('insertHTML',false,`<img src="${src}" alt="">`);markDirty()});return}
  document.execCommand('insertText',false,cd.getData('text/plain'));
});

function autoFix(ch){
  const sel=getSelection(); if(!sel.rangeCount||!sel.isCollapsed)return;
  const r=sel.getRangeAt(0),node=r.startContainer; if(node.nodeType!==3)return;
  const pos=r.startOffset,text=node.textContent; const last=text[pos-1]; if(last!==ch&&!(ch===' '&&last==='\u00a0'))return;
  const m=text.slice(0,pos-1).match(/([A-Za-z']+)$/); if(!m)return;
  const word=m[1],fix=CORR[word.toLowerCase()]; if(!fix||word.toLowerCase()==='pubic')return;
  let out=fix;
  if(word.length>1&&word===word.toUpperCase()) out=fix.toUpperCase();
  else if(/^[A-Z]/.test(word)) out=fix[0].toUpperCase()+fix.slice(1);
  if(out===word)return;
  const rg=document.createRange();rg.setStart(node,pos-1-word.length);rg.setEnd(node,pos);
  sel.removeAllRanges();sel.addRange(rg);document.execCommand('insertText',false,out+ch);
}

function linkDialog(){

  dialog({title:'Insert link',body:`<label>Text (optional)</label><input class="field" id="lk-t" value="${esc(txt)}"><label>Address</label><input class="field" id="lk-u" type="url" inputmode="url" placeholder="https://…" autocomplete="off">`,
    actions:[{label:'Cancel'},{label:'Insert',cls:'primary',fn:o=>{

      document.execCommand('insertHTML',false,`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>&nbsp;`);markDirty();}}],
    onOpen:o=>setTimeout(()=>$('#lk-u',o).focus(),60)});
}
function compressImage(file,max=1280){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.82));};im.src=fr.result};
    fr.readAsDataURL(file);
  });
}
function imageDialog(){
  dialog({title:'Insert image',body:`<label>Choose a photo</label><input class="field" id="im-f" type="file" accept="image/*" style="padding-top:9px"><label>…or paste an image link</label><input class="field" id="im-u" type="url" placeholder="https://…" autocomplete="off">`,
    actions:[{label:'Cancel'},{label:'Insert',cls:'primary',fn:o=>{
      const f=$('#im-f',o).files[0],u=$('#im-u',o).value.trim();
      if(f){toast('Adding image…',1500);compressImage(f).then(src=>{restoreSel();document.execCommand('insertHTML',false,`<img src="${src}" alt=""><p><br></p>`);markDirty()}).catch(()=>toast('Could not read that image'))}
      else if(/^https?:\/\//i.test(u)){restoreSel();document.execCommand('insertHTML',false,`<img src="${esc(u)}" alt=""><p><br></p>`);markDirty()}}}]});
}

/* reminders */
let remT=null;
function reminderDialog(){
  const n=byId(cur);if(!n)return;
  const def=n.reminder||Math.ceil((Date.now()+36e5)/9e5)*9e5;
  dialog({title:'Reminder',body:`<label>Remind me on</label><input class="field" id="rm-d" type="datetime-local" value="${toLocalInput(def)}">`,
    actions:[{label:'Cancel'},...(n.reminder?[{label:'Remove',cls:'danger',fn:()=>{n.reminder=0;persistNotes();paintHeader(n);metaLine(n);scheduleReminder()}}]:[]),
      {label:'Save',cls:'primary',fn:o=>{const v=$('#rm-d',o).value;if(!v)return false;n.reminder=new Date(v).getTime();persistNotes();paintHeader(n);metaLine(n);scheduleReminder();
        toast('Reminder set');if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().catch(()=>{});}}]});
}
function scheduleReminder(){
  clearTimeout(remT); const now=Date.now();
  const next=live().filter(n=>n.reminder>now).sort((a,b)=>a.reminder-b.reminder)[0]; if(!next)return;
  remT=setTimeout(()=>{fireReminder(next.id)},Math.min(next.reminder-now,2147e6));
}
function fireReminder(id){
  const n=byId(id); if(n&&!n.trashed&&n.reminder&&n.reminder<=Date.now()+1500){
    const title='⏰ '+(n.title||'Reminder'),body=n.text.slice(0,100);
    if('Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:n.id})).catch(()=>{});
    toast(title,5000);
  }
  renderAll(); scheduleReminder();
}

/* share / export / print */
function shareNote(n){
  const data={title:n.title||'Note',text:(n.title?n.title+'\n\n':'')+(n.text||'')};
  if(navigator.share) navigator.share(data).catch(()=>{});
  else navigator.clipboard?.writeText(data.text).then(()=>toast('Copied to clipboard'));
}
function download(name,type,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const safeName=s=>(s||'note').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'note';
const noteDoc=n=>`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(n.title||'Note')}</title><style>body{font:17px/1.75 Georgia,serif;max-width:720px;margin:48px auto;padding:0 20px;color:#111}img{max-width:100%}blockquote{border-left:3px solid #f5b73b;margin-left:0;padding-left:16px;color:#555}pre{background:#f3f4f6;padding:12px;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>${esc(n.title||'Untitled')}</h1>${n.content}</body></html>`;
function exportNote(n,t){
  if(t==='html') download(safeName(n.title)+'.html','text/html',noteDoc(n));
  else download(safeName(n.title)+'.txt','text/plain',(n.title?n.title+'\n\n':'')+n.text);
  toast('Exported');
}
function printNote(n){
  const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(f);f.srcdoc=noteDoc(n);
  f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){}setTimeout(()=>f.remove(),2000)};
}

/* ================= folders ================= */
function folderDialog(existing,done){
  dialog({title:existing?'Rename folder':'New folder',body:`<input class="field" id="fo-n" maxlength="30" placeholder="Folder name" autocomplete="off" value="${esc(existing?existing.name:'')}">`,
    actions:[{label:'Cancel'},{label:existing?'Save':'Create',cls:'primary',fn:o=>{
      const name=$('#fo-n',o).value.trim(); if(!name)return false;
      if(existing){existing.name=name;persistFolders();renderAll();done&&done(existing);return}
      const f={id:uid(),name,color:FOLDER_COLORS[folders.length%FOLDER_COLORS.length]};
      folders.push(f);persistFolders();renderAll();done&&done(f);}}],
    onOpen:o=>setTimeout(()=>$('#fo-n',o).focus(),60)});
}

/* ================= backup ================= */
function exportAll(){
  download(`folio-backup-${new Date().toISOString().slice(0,10)}.json`,'application/json',JSON.stringify({app:'folio',v:2,exported:Date.now(),notes,folders},null,1));
  toast('Backup saved');
}
function importAll(file){
  const fr=new FileReader();
  fr.onload=()=>{try{
    const d=JSON.parse(fr.result); const incoming=Array.isArray(d)?d:d.notes; if(!Array.isArray(incoming))throw 0;
    const map=new Map(notes.map(n=>[n.id,n])); incoming.forEach(n=>{const x=normalize(n);map.set(x.id,x)}); notes=[...map.values()];
    if(Array.isArray(d.folders)){const ids=new Set(folders.map(f=>f.id));d.folders.forEach(f=>{if(f&&f.id&&f.name&&!ids.has(f.id))folders.push({id:String(f.id),name:String(f.name).slice(0,30),color:f.color||FOLDER_COLORS[0]})});persistFolders()}
    persistNotes();renderAll();toast(`Imported ${incoming.length} notes`);
  }catch(e){toast('That file is not a valid Folio backup',3000)}};
  fr.readAsText(file);
}

/* ================= actions (event delegation) ================= */
function go(v){ view=v; query=''; $('#search').value=''; $('#search-wrap').classList.remove('has'); closeSidebar(); renderAll(); $('#content').scrollTop=0; }
function openSidebar(){$('#sidebar').classList.add('open');$('#scrim-d').classList.add('open')}
function closeSidebar(){$('#sidebar').classList.remove('open');$('#scrim-d').classList.remove('open')}
function setTheme(t){
  settings.theme=t;persistSettings();
  const r=t==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):t;
  document.documentElement.dataset.theme=r;
  $('meta[name=theme-color]').content=r==='dark'?'#0a0f18':'#e8edf6'; renderAll();
}
function act(name,el,ev){
  const card=el.closest('.card'), id=card&&card.dataset.id;
  switch(name){
    case 'new-note': newNote(); break;
    case 'pin': ev.stopPropagation(); setPinned(id,!byId(id).pinned); break;
    case 'restore': ev.stopPropagation(); {const n=byId(id);n.trashed=0;n.updated=Date.now();persistNotes();renderAll();toast('Restored')} break;
    case 'purge': ev.stopPropagation(); confirmBox('Delete forever?','This note will be permanently removed.','Delete',()=>{notes=notes.filter(n=>n.id!==id);persistNotes();renderAll()}); break;
    case 'empty-trash': confirmBox('Empty trash?','All deleted notes will be permanently removed.','Empty',()=>{notes=notes.filter(n=>!n.trashed);persistNotes();renderAll()}); break;
    case 'new-folder': folderDialog(null,f=>go('folder:'+f.id)); break;
    case 'rename-folder': folderDialog(folders.find(f=>f.id===view.slice(7))); break;
    case 'del-folder': {const f=folders.find(x=>x.id===view.slice(7));
      confirmBox('Delete folder?',`“${esc(f.name)}” will be removed. Its notes are kept and moved to All Notes.`,'Delete folder',()=>{notes.forEach(n=>{if(n.folder===f.id)n.folder=''});folders=folders.filter(x=>x!==f);persistNotes();persistFolders();go('all')});} break;
    case 'goto-settings': go('settings'); break;
    case 'theme-set': setTheme(el.dataset.v); break;
    case 'toggle-ac': settings.autocorrect=!settings.autocorrect;persistSettings();renderAll(); break;
    case 'install': doInstall(); break;
    case 'export-all': exportAll(); break;
    case 'import-all': {const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>i.files[0]&&importAll(i.files[0]);i.click()} break;
    case 'wipe': confirmBox('Erase everything?','All notes, folders and settings on this device will be deleted. This cannot be undone — export a backup first.','Erase all',()=>{notes=[];folders=[];persistNotes();persistFolders();toast('Everything erased');go('all')}); break;
  }
}

matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(settings.theme==='auto')setTheme('auto')});

/* ================= INSTALL (PWA) ================= */
let deferred=null;
const installedFlag=()=>!!localStorage.getItem('folio_installed');
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function installAvailable(){return !isStandalone()&&(deferred||isIOS())}
function showInstallUI(){
  if(isStandalone()||installedFlag())return;
  $('#side-install').classList.add('show');
  const dismissed=+localStorage.getItem('folio_install_x')||0;
  if(installAvailable()&&Date.now()-dismissed>7*DAY) setTimeout(()=>$('#install').classList.add('show'),2200);
}
function hideInstallUI(){$('#install').classList.remove('show');$('#side-install').classList.remove('show');$('#side-install').style.display='none'}
async function doInstall(){
  if(deferred){
    $('#install').classList.remove('show');
    deferred.prompt(); const r=await deferred.userChoice.catch(()=>({})); deferred=null;
    if(r.outcome==='accepted'){localStorage.setItem('folio_installed','1');hideInstallUI()} else $('#side-install').classList.add('show');
    return;
  }
  const ios=isIOS();
  dialog({title:'Install Folio',body:ios
    ?'<ol><li>Tap the <b>Share</b> button in Safari.</li><li>Scroll and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b> — Folio opens full-screen like a real app.</li></ol>'
    :'<ol><li>Open your browser menu (⋮ or ⋯).</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Confirm — Folio opens full-screen like a real app.</li></ol><p style="margin-top:10px">If you don’t see it, open this page over <b>https</b> in Chrome, Edge or Safari.</p>',
    actions:[{label:'Got it',cls:'primary'}]});
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showInstallUI()});
addEventListener('appinstalled',()=>{localStorage.setItem('folio_installed','1');deferred=null;hideInstallUI();toast('Folio installed 🎉',3000)});
$('#install-go').onclick=doInstall;
$('#install-x').addEventListener('click',e=>{e.stopPropagation();$('#install').classList.remove('show');try{localStorage.setItem('folio_install_x',Date.now())}catch(_){}});
matchMedia('(display-mode: standalone)').addEventListener?.('change',()=>{if(isStandalone())hideInstallUI()});

/* ================= boot ================= */
$('meta[name=theme-color]').content=document.documentElement.dataset.theme==='dark'?'#0a0f18':'#e8edf6';
paintStaticIcons(); buildToolbar(); renderAll(); scheduleReminder();
if(isStandalone()){try{localStorage.setItem('folio_installed','1')}catch(_){}$('#install').remove();$('#side-install').remove()}
else if(isIOS()) showInstallUI();
if('serviceWorker' in navigator && location.protocol!=='file:'){
  let reloading=false; const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(!had||reloading)return; reloading=true; flush(); toast('Folio updated — refreshing…',1200); setTimeout(()=>location.reload(),900); });
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update&&r.update()).catch(()=>{}));
}
if(new URLSearchParams(location.search).get('new')==='1'){ history.replaceState(null,'',location.pathname); newNote(); }
else if(live().some(n=>n.reminder&&n.reminder<=Date.now())) setTimeout(()=>toast('You have reminders due',3000),600);
</script>
</body>
</html>
